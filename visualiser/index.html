<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Turtle Visualizer</title>
  <style>
    #sigma-container {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
    }
  </style>

  <!-- Dependencies -->
  <script src="https://unpkg.com/n3@1.16.3/browser/n3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>

  <!-- Standalone Visualizer -->
  <script src="turtle-visualizer.js"></script>
</head>
<body>

  <div id="sigma-container"></div>

  <script>
  const urlParams = new URLSearchParams(window.location.search);
  const turtleFile = urlParams.get('file') || '../generated-ontologies/generated_ontology.ttl';

  visualizeTurtle(turtleFile, 'sigma-container')
    .then(() => console.log('File loaded and rendered successfully'))
    .catch((err) => console.error('Error loading TTL file:', err));
  </script>
</body>
</html>
