[project]
name = "lang-chain"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.0.0",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
