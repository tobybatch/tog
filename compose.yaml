services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./inputs/single:/app/inputs
      - ./outputs:/app/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    command: ["inputs", "outputs/generated-ontology.ttl"]
