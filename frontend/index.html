<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxonomy & Ontology Visualizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #060c1a;
            color: #e4e4e7;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 70%),
                    radial-gradient(ellipse 50% 40% at 80% 100%, rgba(168,85,247,0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        #controls {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: left 0.3s ease;
        }
        #controls.with-panel { left: 425px; }
        select, input[type="text"] {
            padding: 0.5rem 0.75rem;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #e4e4e7;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        select { cursor: pointer; min-width: 180px; }
        input[type="text"] { min-width: 200px; }
        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        #error {
            display: none;
            padding: 0.5rem 0.75rem;
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.4);
            border-radius: 6px;
            color: #fca5a5;
            font-size: 0.875rem;
        }
        #stats {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 200;
            background: rgba(9,15,30,0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 140px;
        }
        #info {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #details-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 150;
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }
        #details-panel.open { transform: translateX(0); }
        #details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        #details-header h2 { color: #fff; font-size: 1.25rem; font-weight: 600; }
        #close-details {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
            width: 2rem;
            height: 2rem;
            border-radius: 4px;
        }
        #close-details:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        #details-content { flex: 1; overflow-y: auto; padding: 1.5rem; font-size: 0.875rem; }
        #graph { width: 100vw; height: 100vh; transition: margin-left 0.3s ease; }
        #graph.with-panel { margin-left: 400px; width: calc(100vw - 400px); }
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6,12,26,0.85);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="controls">
    <input type="text" id="search" placeholder="Search nodes..." />
    <select id="filter" onchange="window.applyFilter()">
        <option value="">All types</option>
    </select>
    <span id="error"></span>
</div>

<div id="loading-overlay">
    <div class="spinner"></div>
    <p style="color: #94a3b8; font-size: 0.875rem;">Computing ForceAtlas2 layout…</p>
</div>

<div id="stats">
    <div id="info"></div>
    <div id="legend"></div>
</div>

<div id="details-panel">
    <div id="details-header">
        <h2>Node Details</h2>
        <button id="close-details" onclick="window.closeDetailsPanel()">×</button>
    </div>
    <div id="details-content">
        <p style="color: #64748b; text-align: center; margin-top: 2rem;">Click a node to view details</p>
    </div>
</div>

<div id="graph"></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
